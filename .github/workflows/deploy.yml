name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # ============================================
      # 1. Checkout
      # ============================================
      - name: Checkout code
        uses: actions/checkout@v4


      # ============================================
      # 2. Setup Node.js
      # ============================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          cache: npm


      # ============================================
      # 3. Install dependencies
      # ============================================
      - name: Install dependencies
        run: |
          echo "======================================"
          echo "Installing dependencies"
          echo "======================================"

          npm ci --no-audit --no-fund

          echo "Dependencies installed successfully."


      # ============================================
      # 4. Clean previous build
      # ============================================
      - name: Clean previous build
        run: |
          echo "======================================"
          echo "Cleaning previous build"
          echo "======================================"

          rm -rf .next
          rm -rf out

          echo "Previous build cleaned."


      # ============================================
      # 5. Build Next.js
      # ============================================
      - name: Build Next.js
        run: |
          echo "======================================"
          echo "Building Next.js"
          echo "======================================"

          npm run build

          echo "Next.js build completed."


      # ============================================
      # 6. Check build output
      # ============================================
      - name: Check build output
        run: |
          echo "======================================"
          echo "Checking build output"
          echo "======================================"

          if [ ! -d "out" ]; then
            echo "ERROR: out directory was not created!"
            echo "Make sure Next.js static export is configured."
            exit 1
          fi

          echo "SUCCESS: out directory exists."

          echo ""
          echo "Total files:"
          find out -type f | wc -l

          echo ""
          echo "HTML files:"
          find out -type f -name "*.html" -print | head -50

          echo ""
          echo "Build output:"
          ls -la out

          echo ""
          echo "Build output check completed."


      # ============================================
      # 7. Install deployment tools
      # ============================================
      - name: Install deployment tools
        run: |
          echo "======================================"
          echo "Installing deployment tools"
          echo "======================================"

          sudo apt-get update

          sudo apt-get install -y \
            rsync \
            sshpass \
            openssh-client

          echo "Deployment tools installed successfully."


      # ============================================
      # 8. Test SSH connection
      # ============================================
      - name: Test Hostinger SSH connection
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}

        run: |
          echo "======================================"
          echo "Testing SSH connection"
          echo "======================================"

          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -p "$SSH_PORT" \
            "$SSH_USERNAME@$SSH_HOST" \
            "
              echo 'SSH connection successful'
              echo 'Username:'
              whoami

              echo 'Home:'
              pwd

              echo 'Server:'
              hostname
            "

          echo ""
          echo "SSH test completed successfully."


      # ============================================
      # 9. Prepare correct domain public_html
      # ============================================
      - name: Prepare zoyotrips.com public_html
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}

        run: |
          echo "======================================"
          echo "Preparing zoyotrips.com public_html"
          echo "======================================"

          DEPLOY_PATH="/home/$SSH_USERNAME/domains/zoyotrips.com/public_html"

          echo "Deployment path:"
          echo "$DEPLOY_PATH"

          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -p "$SSH_PORT" \
            "$SSH_USERNAME@$SSH_HOST" \
            "
              echo 'Current user:'
              whoami

              echo ''
              echo 'Checking domain directory:'
              ls -ld /home/$SSH_USERNAME/domains/zoyotrips.com

              echo ''
              echo 'Checking public_html:'
              ls -ld /home/$SSH_USERNAME/domains/zoyotrips.com/public_html

              echo ''
              echo 'Real deployment path:'
              realpath /home/$SSH_USERNAME/domains/zoyotrips.com/public_html

              echo ''
              echo 'Current files:'
              ls -la /home/$SSH_USERNAME/domains/zoyotrips.com/public_html | head -30
            "

          echo ""
          echo "Correct public_html verified."


      # ============================================
      # 10. Upload ONLY Next.js build
      # ============================================
      - name: Upload build to zoyotrips.com
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}

        run: |
          echo "======================================"
          echo "Uploading Next.js build"
          echo "======================================"

          DEPLOY_PATH="/home/$SSH_USERNAME/domains/zoyotrips.com/public_html"

          echo "Source:"
          echo "out/"

          echo ""
          echo "Destination:"
          echo "$DEPLOY_PATH/"

          echo ""
          echo "Starting rsync..."

          sshpass -e rsync \
            -avz \
            --progress \
            -e "ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -p $SSH_PORT" \
            out/ \
            "$SSH_USERNAME@$SSH_HOST:$DEPLOY_PATH/"

          echo ""
          echo "======================================"
          echo "Upload completed successfully"
          echo "======================================"


      # ============================================
      # 11. Verify deployment
      # ============================================
      - name: Verify deployment
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}

        run: |
          echo "======================================"
          echo "Verifying deployment"
          echo "======================================"

          DEPLOY_PATH="/home/$SSH_USERNAME/domains/zoyotrips.com/public_html"

          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -p "$SSH_PORT" \
            "$SSH_USERNAME@$SSH_HOST" \
            "
              echo 'Deployment directory:'
              echo '$DEPLOY_PATH'

              echo ''
              echo 'Real path:'
              realpath '$DEPLOY_PATH'

              echo ''
              echo 'Files in public_html:'
              ls -la '$DEPLOY_PATH' | head -50

              echo ''
              echo 'Checking index.html...'

              if [ -f '$DEPLOY_PATH/index.html' ]; then
                echo 'SUCCESS: index.html exists.'
              else
                echo 'ERROR: index.html was not found!'
                exit 1
              fi

              echo ''
              echo 'Checking _next directory...'

              if [ -d '$DEPLOY_PATH/_next' ]; then
                echo 'SUCCESS: _next directory exists.'
              else
                echo 'WARNING: _next directory not found.'
              fi

              echo ''
              echo 'Deployment directory verified successfully.'
            "

          echo ""
          echo "======================================"
          echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "======================================"