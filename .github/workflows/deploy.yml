name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # ============================================
      # 1. Checkout
      # ============================================
      - name: Checkout code
        uses: actions/checkout@v4


      # ============================================
      # 2. Setup Node.js (with built-in npm caching)
      # ============================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          cache: npm

      # ============================================
      # 3. Install dependencies (npm ci = clean, verified install)
      # ============================================
      - name: Install dependencies
        run: |
          echo "======================================"
          echo "Installing dependencies with npm ci"
          echo "======================================"
          npm ci --no-audit --no-fund

      # ============================================
      # 4. Clean previous build
      # ============================================
      - name: Clean previous build
        run: |
          echo "======================================"
          echo "Cleaning previous build"
          echo "======================================"
          rm -rf .next
          rm -rf out

      # ============================================
      # 5. Build Next.js
      # ============================================
      - name: Build Next.js
        run: |
          echo "======================================"
          echo "Building Next.js"
          echo "======================================"
          npm run build

      # ============================================
      # 6. Check build output
      # ============================================
      - name: Check build output
        run: |
          echo "======================================"
          echo "Checking build output"
          echo "======================================"
          if [ ! -d "out" ]; then
            echo "ERROR: out directory was not created!"
            exit 1
          fi
          echo "out directory exists."
          echo "Total files:"
          find out -type f | wc -l
          echo "HTML files:"
          find out -type f -name "*.html" -print | head -50
          echo "Build output check completed."

      # ============================================
      # 7. Install SSH tools
      # ============================================
      - name: Install deployment tools
        run: |
          echo "======================================"
          echo "Installing deployment tools"
          echo "======================================"
          sudo apt-get update
          sudo apt-get install -y \
            rsync \
            sshpass \
            openssh-client
          echo "Deployment tools installed."

      # ============================================
      # 8. Test SSH connection
      # ============================================
      - name: Test Hostinger SSH connection
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          echo "======================================"
          echo "Testing SSH connection"
          echo "======================================"
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -p "$SSH_PORT" \
            "$SSH_USERNAME@$SSH_HOST" \
            "echo 'SSH connection successful'; whoami; pwd; ls -la"

      # ============================================
      # 9. Prepare public_html
      # ============================================
      - name: Prepare Hostinger public_html
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          echo "======================================"
          echo "Preparing Hostinger public_html"
          echo "======================================"
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -p "$SSH_PORT" \
            "$SSH_USERNAME@$SSH_HOST" \
            "
              echo 'Checking home directory...'
              pwd
              echo 'Checking public_html...'
              if [ ! -d /home/u344423240/public_html ]; then
                echo 'public_html does not exist. Creating it...'
                mkdir -p /home/u344423240/public_html
              fi
              echo 'public_html permissions:'
              ls -ld /home/u344423240/public_html
              echo 'public_html currently contains:'
              ls -la /home/u344423240/public_html | head -20
            "

      # ============================================
      # 10. Upload using RSYNC
      # ============================================
      - name: Upload build to Hostinger
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          echo "======================================"
          echo "Uploading build to Hostinger"
          echo "======================================"
          sshpass -e rsync \
            -avz \
            --delete \
            --progress \
            -e "ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -p $SSH_PORT" \
            out/ \
            "$SSH_USERNAME@$SSH_HOST:/home/u344423240/public_html/"
          echo "======================================"
          echo "Upload completed successfully"
          echo "======================================"

      # ============================================
      # 11. Verify deployment
      # ============================================
      - name: Verify deployment
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          echo "======================================"
          echo "Verifying deployment"
          echo "======================================"
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -p "$SSH_PORT" \
            "$SSH_USERNAME@$SSH_HOST" \
            "
              echo 'Files in public_html:'
              ls -la /home/u344423240/public_html/ | head -30
              echo ''
              echo 'index.html check:'
              if [ -f /home/u344423240/public_html/index.html ]; then
                echo 'SUCCESS: index.html exists'
              else
                echo 'WARNING: index.html not found'
              fi
            "
          echo "======================================"
          echo "DEPLOYMENT COMPLETED"
          echo "======================================"
