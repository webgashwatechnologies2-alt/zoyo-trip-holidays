name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org/

      # 3. Configure npm
      - name: Configure npm
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 10000
          npm config set fetch-retry-maxtimeout 60000

      # 4. Clean npm cache
      - name: Clean npm cache
        run: npm cache clean --force

      # 5. Install dependencies
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # 6. Clean previous build
      - name: Clean previous build
        run: |
          rm -rf .next
          rm -rf out

      # 7. Build Next.js
      - name: Build Next.js
        run: npm run build

      # 8. Check build output
      - name: Check build output
        run: |
          echo "Checking build output..."

          if [ ! -d "out" ]; then
            echo "ERROR: out directory was not created!"
            exit 1
          fi

          echo "Total files in out:"
          find out -type f | wc -l

          echo "Root HTML files:"
          ls out/*.html

      # 9. Upload build to server
      - name: Upload build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "out"
          target: "/home/u344423240/deploy_temp"
          strip_components: 0
          rm: false

      # 10. Move files to public_html
      - name: Move files to public_html via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "=== Clearing public_html ==="
            rm -rf /home/u344423240/public_html/*

            echo "=== Copying files ==="
            cp -r /home/u344423240/deploy_temp/out/. /home/u344423240/public_html/

            echo "=== Cleaning temp ==="
            rm -rf /home/u344423240/deploy_temp

            echo "=== Deployment completed ==="
            echo "Files in public_html:"
            ls -la /home/u344423240/public_html/ | head -20
