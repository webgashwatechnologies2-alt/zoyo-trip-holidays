name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Clean npm cache
        run: npm cache clean --force

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Clean previous build
        run: |
          rm -rf .next
          rm -rf out

      - name: Build Next.js
        run: npm run build

      - name: Check build output
        run: |
          echo "Checking build output..."
          test -d out
          echo "Total files in out:"
          find out -type f | wc -l
          echo "Root HTML files:"
          ls out/*.html

      - name: Upload build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "out"
          target: "/home/u344423240/deploy_temp"
          strip_components: 0
          rm: false

      - name: Move files to public_html via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "=== Clearing public_html ==="
            rm -rf /home/u344423240/public_html/*

            echo "=== Copying files ==="
            cp -r /home/u344423240/deploy_temp/out/. /home/u344423240/public_html/

            echo "=== Cleaning temp ==="
            rm -rf /home/u344423240/deploy_temp

            echo "=== Deployment completed ==="
            echo "Files in public_html:"
            ls -la /home/u344423240/public_html/ | head -20
